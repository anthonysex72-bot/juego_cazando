<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Juego Cazando</title>

    <link rel="stylesheet" href="cazando.css">
</head>

<body>

    <div class="contenedor">

        <h1>🐱 JUEGO CAZANDO 🍎</h1>

        <p class="autor">Autor: <strong>ANTHONY REGALADO</strong></p>

        <div class="panel">

            <div class="tarjeta">
                <span>🏆 PUNTOS</span>
                <strong id="puntos">0</strong>
            </div>

            <div class="tarjeta">
                <span>⏱️ TIEMPO</span>
                <strong id="tiempo">0</strong>
            </div>

        </div>

        <div class="zona-juego">

            <canvas id="areaJuego" width="800" height="300"></canvas>

            <audio id="musicaFondo" loop>
              <source src="musica_fondo.mp3" type="audio/mpeg">
            </audio>

            <audio id="musicaVictoria">
              <source src="victoria.mp3" type="audio/mpeg">
            </audio>

            <audio id="musicaDerrota">
              <source src="derrota.mp3" type="audio/mpeg">
            </audio>

            <audio id="sonidoComer">
              <source src="comer.mp3" type="audio/mpeg">
            </audio>

            <p id="mensaje"></p>

        </div>

        <div class="controles">

            <button onclick="moverArriba()">⬆</button>

            <div>
                <button onclick="moverIzquierda()">⬅</button>
                <button onclick="moverAbajo()">⬇</button>
                <button onclick="moverDerecha()">➡</button>
            </div>

       

        <p class="instruccion">
            🎮 También puedes utilizar las teclas
            <strong>↑ ↓ ← →</strong>
            de tu teclado
        </p>
        
        <div><button class="JUGAR" onclick="reiniciarJuego()">
          JUGAR
        </button>

        <button class="reiniciar" onclick="reiniciarJuego()">
            🔄 REINICIAR JUEGO
        </button>

    </div>

    <script src="utils.js"></script>
    <script src="cazando.js"></script>

</body>

</html>
